version: 1
indices:
  sitemap: &default
    target: /sitemap.json
    exclude:
      - 'drafts/**'
      - 'enrichment/**'
      - 'fragments/**'
      - 'products/**'
      - '/es/**'
      - '/fr/**'
      - '/jp/**'
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      template:
        select: head > meta[name="template"]
        value: |
          attribute(el, 'content')
      robots:
        select: head > meta[name="robots"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      category:
        select: head > meta[name="category"]
        value: |
          attribute(el, 'content')
  sitemap-es:
    <<: *default
    target: /es/sitemap.json
    include:
      - '/es/**'
    exclude:
      - '/es/drafts/**'
      - '/es/enrichment/**'
      - '/es/fragments/**'
      - '/es/products/**'
  sitemap-fr:
    <<: *default
    target: /fr/sitemap.json
    include:
      - '/fr/**'
    exclude:
      - '/fr/drafts/**'
      - '/fr/enrichment/**'
      - '/fr/fragments/**'
      - '/fr/products/**'
  sitemap-jp:
    <<: *default
    target: /jp/sitemap.json
    include:
      - '/jp/**'
    exclude:
      - '/jp/drafts/**'
      - '/jp/enrichment/**'
      - '/jp/fragments/**'
      - '/jp/products/**'
  enrichment:
    target: /enrichment/enrichment.json
    include:
      - '**/enrichment/**'
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      products:
        select: head > meta[name="enrichment-products"]
        values: |
          match(attribute(el, 'content'), '([^,]+)')
      categories:
        select: head > meta[name="enrichment-categories"]
        values: |
          match(attribute(el, 'content'), '([^,]+)')
      positions:
        select: head > meta[name="enrichment-positions"]
        values: |
          match(attribute(el, 'content'), '([^,]+)')
